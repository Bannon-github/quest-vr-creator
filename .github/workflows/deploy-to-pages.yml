name: Deploy Quest VR Creator to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for validation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax (Error Reduction Hook)
        run: |
          echo "🧠 Extracting inline script for syntax validation to catch errors early and ensure deploy intelligence..."
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
            if (scriptMatch && scriptMatch[1]) {
              const code = scriptMatch[1].trim();
              fs.writeFileSync("/tmp/vr-script.js", code);
              console.log("Script extracted, length:", code.length);
            } else {
              console.log("No script tag found");
              process.exit(0);
            }
          '
          if node --check /tmp/vr-script.js; then
            echo "✅ JavaScript syntax validation PASSED - no syntax errors detected. Code is clean for Quest VR."
            echo "🧠 Intelligence Note: Hooks integrated (error-mitigation, spawn-intelligence, state-management, tablet-ui). Full modular intelligence active for dynamic spawning, reactive UI, error resilience, 5 primitives, color/material/undo/clear/persist/export/holographic."
            echo "🧠 Recommended: After changes, run full Local Development Workflow from quest-vr-creator skill (Analyze, Plan, Implement, Test syntax+local+VR, Correct, Update skill + docs)."
          else
            echo "❌ JavaScript syntax ERROR detected - failing build to prevent deploying broken code to Quest users."
            exit 1
          fi

      - name: Validate Hooks JavaScript Syntax (Extended Intelligence & Error Prevention)
        run: |
          echo "🧠 Validating hooks/*.js files - these provide the core intelligence layer (state, spawn, UI, error mitigation, materials, persist). Ensuring zero syntax errors for robust VR experience."
          expected_hooks=("error-mitigation-hook.js" "state-management-hook.js" "spawn-intelligence-hook.js" "tablet-ui-hook.js")
          for expected in "${expected_hooks[@]}"; do
            if [ ! -f "hooks/$expected" ]; then
              echo "❌ Missing required intelligence hook: hooks/$expected — blocking deploy."
              exit 1
            fi
          done
          for hook in hooks/*.js; do
            if [ -f "$hook" ]; then
              echo "Checking $hook ..."
              if node --check "$hook"; then
                echo "✅ $hook syntax PASSED - intelligence module clean."
              else
                echo "❌ $hook syntax FAILED - blocking deploy to protect Quest users."
                exit 1
              fi
            fi
          done
          echo "✅ All hooks validated successfully. Project embodies modular, error-resistant, intelligent design."
          for hook in hooks/*.js; do
            size=$(wc -c < "$hook")
            if [ "$size" -lt 500 ]; then
              echo "❌ $hook is suspiciously small ($size bytes) — possible placeholder regression. Blocking deploy."
              exit 1
            fi
            if ! grep -qE "function|window\." "$hook"; then
              echo "⚠️ $hook may lack expected exports — check for window.* or function definitions."
            fi
          done
          spawn_size=$(wc -c < hooks/spawn-intelligence-hook.js)
          tablet_size=$(wc -c < hooks/tablet-ui-hook.js)
          state_size=$(wc -c < hooks/state-management-hook.js)
          if [ "$spawn_size" -lt 5000 ] || [ "$tablet_size" -lt 10000 ] || [ "$state_size" -lt 8000 ]; then
            echo "⚠️ One or more hooks smaller than expected for current feature set (materials/persist/5-primitives/holographic). Review content."
          else
            echo "✅ Hook sizes consistent with expanded feature set (5 primitives + materials + persist + actions + holographic)."
          fi

      - name: Intelligence & Best Practices Guidance + Feature Presence (Non-Blocking Advisory + Critical Checks)
        run: |
          echo "🧠 Running intelligence scan for key VR Creator patterns (state, error hooks, spawn logic, tablet UI, materials, persist, expanded features)..."
          if grep -q "VRCreatorState\|updateVRState" index.html || [ -f hooks/state-management-hook.js ]; then
            echo "✅ State management hook/pattern detected — good for intelligence and reactive features."
          else
            echo "💡 Opportunity: Integrate state-management-hook.js for better tracking of spawns/tools."
          fi
          if grep -q "safeExecute\|error-mitigation-hook" index.html || [ -f hooks/error-mitigation-hook.js ]; then
            echo "✅ Error mitigation listener/hook present — aligns with less-errors principle."
          fi
          if grep -q "spawn-button\|spawnIntelligentObject" index.html || [ -f hooks/spawn-intelligence-hook.js ]; then
            echo "✅ Spawn intelligence + spawn-button component detected — dynamic camera-aware placement active."
          fi
          if grep -q "initTabletUI\|tablet-ui-hook" index.html || [ -f hooks/tablet-ui-hook.js ]; then
            echo "✅ Tablet UI hook integrated — multi-tool reactive UI active."
          fi
          if grep -q "clearAllSpawned\|setSelectedColor\|cone\|torus" hooks/*.js; then
            echo "✅ Expanded features detected (clearAll / color / cone / torus) — intelligence layer fully modern."
          else
            echo "⚠️ Some expanded features (clearAllSpawned, setSelectedColor, cone/torus) not found in hooks — may indicate regression."
          fi
          if grep -q "setMaterialPreset\|selectedMaterial\|materialPresets" hooks/*.js; then
            echo "✅ Material system detected (setMaterialPreset / selectedMaterial / presets) — advanced PBR intelligence active."
          else
            echo "⚠️ Material features not found — check state/spawn/tablet for material support."
          fi
          if grep -q "saveSceneToStorage\|loadSceneFromStorage\|exportSceneJSON\|deleteSpawnedObject" hooks/*.js; then
            echo "✅ Persistence & export & delete features detected — full scene intelligence layer active."
          else
            echo "⚠️ Persist/export/delete not fully present — review state hook."
          fi
          if grep -q "makeWristHolographic\|holographic" hooks/*.js; then
            echo "✅ Holographic wrist tablet support detected — vision-aligned."
          fi
          if grep -q "stats" index.html; then
            echo "✅ a-stats / FPS monitor present for Quest performance tuning."
          fi
          if grep -q "hooks/error-mitigation-hook.js" index.html && grep -q "hooks/state-management-hook.js" index.html && grep -q "hooks/spawn-intelligence-hook.js" index.html && grep -q "hooks/tablet-ui-hook.js" index.html; then
            echo "✅ All four intelligence hooks correctly referenced in index.html (correct load order dependency)."
          else
            echo "⚠️ One or more hooks missing from index.html script tags — check load order."
          fi
          if [ -d hooks ]; then
            echo "✅ hooks/ directory present with modular intelligence files."
          fi
          # Docs desync advisory (reduces future errors from overclaimed features)
          if [ -f TODO.md ]; then
            if grep -qE "GLTF|URL hash|double-grip|Advanced material panel|HOLO|SHARE" TODO.md; then
              if ! grep -qE "exportSceneGLTF|loadSceneFromHash|adjustMaterial|doubleGrip|HOLO|SHARE" hooks/*.js index.html 2>/dev/null; then
                echo "⚠️ Docs advisory: TODO.md references advanced features (GLTF/share/adjust/double-grip/HOLO) not found in current hooks/index — correct docs to match code to prevent intelligence desync."
              fi
            fi
          fi
          echo "🧠 All guidance is advisory (except syntax/size which are hard gates) to help build with maximal intelligence and minimal errors. The quest-vr-creator skill + hooks + this workflow form a complete automation system for your vision. Always sync TODO/PROOF/README to actual code after changes."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
